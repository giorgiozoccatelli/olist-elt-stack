version: 2

models:
  - name: stg_order_reviews
    description: >
      Order reviews. Note: review_id on its own is not unique in the source dataset 
      (Olist reuses the same review_id when the review text matches, even across different orders) — 
      the true composite primary key is the combination of review_id and order_id.
    columns:
      - name: review_id
        tests:
          - not_null
      - name: order_id
        tests:
          - not_null